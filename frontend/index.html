<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЧМ-2026 — Расписание по Ташкенту</title>
<script src="/wails/runtime.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#0F1011; --bg1:#17181A; --bg2:#1F2123; --bg3:#26282B; --hd:#1E2023;
  --line:#2A2C2F; --tp:#ECECEA; --ts:#9A9C9F; --tm:#63666A;
  --acc:#21A179; --acc-soft:#11352B; --acc-line:#1E5B49;
  --blue:#4A90D9; --blue-soft:#16273B;
  --win-bg:#11352B; --win-line:#1E5B49; --win-tx:#2BB489;
  --loss-bg:#361614; --loss-line:#5E2620; --loss-tx:#E5604E;
  --draw-bg:#352B12; --draw-line:#5E4A1E; --draw-tx:#D4A53A;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg0);color:var(--tp);font-size:14px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}

/* ---- Chrome (header + tabs) ---- */
.chrome{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.brand .ball{font-size:30px;line-height:1}
.brand h1{font-size:19px;font-weight:700;color:var(--tp)}
.brand p{font-size:12px;color:var(--ts);margin-top:2px}
.segmented{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--bg1);border:1px solid var(--line)}
.seg{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ts);cursor:pointer;user-select:none;white-space:nowrap}
.seg:hover{color:var(--tp)}
.seg.active{background:var(--bg3);color:var(--tp);font-weight:600}
.chrome-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.settings{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--bg1);border:1px solid var(--line)}
.cfg{-webkit-appearance:none;appearance:none;background-color:transparent;border:none;color:var(--tp);font-size:13px;font-weight:500;padding:9px 32px 9px 13px;border-radius:8px;cursor:pointer;outline:none;background-repeat:no-repeat;background-position:right 11px center;background-size:11px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='12'%20height='12'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%239A9C9F'%20stroke-width='2.2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpolyline%20points='6%209%2012%2015%2018%209'/%3E%3C/svg%3E")}
.cfg:hover{background-color:var(--bg2)}
.cfg:focus{background-color:var(--bg2)}
.cfg option{background:var(--bg2);color:var(--tp)}
.group-card .gt{text-transform:uppercase}

/* ---- Main scroll area ---- */
.main{flex:1 1 auto;overflow-y:auto}
.panel{display:none}
.panel.active{display:block}
.wrap{max-width:1120px;margin:0 auto;padding:18px 28px 32px}

/* ---- Date carousel ---- */
.carousel{flex:0 0 auto;background:var(--bg0);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:10px 28px}
.car-arrow{flex:0 0 auto;width:34px;height:46px;border-radius:10px;background:var(--bg1);border:1px solid var(--line);
  color:var(--ts);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.car-arrow:hover{background:var(--bg2);color:var(--tp)}
.car-track{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;flex:1 1 auto;padding:2px 0}
.car-track::-webkit-scrollbar{height:0}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 15px;border-radius:10px;
  background:var(--bg1);border:1px solid var(--line);cursor:pointer;min-width:54px}
.chip:hover{background:var(--bg2)}
.chip .wd{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--tm);text-transform:uppercase}
.chip .dn{font-size:16px;font-weight:700;color:var(--tp)}
.chip.active{background:var(--acc-soft);border-color:var(--acc-line)}
.chip.active .wd,.chip.active .dn{color:var(--acc)}

/* ---- Schedule (match-center cards) ---- */
.day-block{margin-bottom:22px;scroll-margin-top:78px}
.day-head{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--ts);margin:14px 2px 10px}
.mc-card{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:16px 22px;margin-bottom:10px}
.mc-row{display:grid;grid-template-columns:1fr 130px 1fr;align-items:center}
.mc-team{display:flex;align-items:center;min-width:0}
.mc-team.left{justify-content:flex-end;text-align:right}
.mc-team.right{justify-content:flex-start;text-align:left}
.mc-name{font-size:16px;font-weight:500;color:var(--tp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-name.win{font-weight:700}
.mc-score{display:flex;align-items:center;justify-content:center;gap:8px}
.mc-colon{font-size:18px;font-weight:700;color:var(--tm);user-select:none}
.sc{width:44px;height:44px;border-radius:10px;text-align:center;font-size:20px;font-weight:700;
  background:var(--bg2);border:1px solid var(--line);color:var(--tm);outline:none;-moz-appearance:textfield}
.sc::-webkit-inner-spin-button,.sc::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sc:focus{border-color:var(--acc)}
.sc.win{background:var(--win-bg);border-color:var(--win-line);color:var(--win-tx)}
.sc.loss{background:var(--loss-bg);border-color:var(--loss-line);color:var(--loss-tx)}
.sc.draw{background:var(--draw-bg);border-color:var(--draw-line);color:var(--draw-tx)}
.mc-meta{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.mc-time{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;background:var(--bg2);font-size:12px;font-weight:700;color:var(--tp)}
.mc-time em{font-style:normal;font-weight:400;font-size:11px;color:var(--tm)}
.mc-venue{font-size:12px;color:var(--ts)}
.mc-meta .dot{color:var(--tm)}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap}
.badge.group{background:var(--blue-soft);color:var(--blue)}
.badge.ko{background:var(--acc-soft);color:var(--acc)}
.no-results{text-align:center;padding:48px;color:var(--ts)}

/* ---- Prediction inputs ---- */
.mc-row{grid-template-columns:1fr 188px 1fr}
.mc-center{display:flex;flex-direction:column;align-items:center;gap:5px}
.mc-cap{font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--tm);text-transform:uppercase}
.mc-pred{display:flex;align-items:center;gap:6px}
.mc-pred .mc-colon{font-size:14px}
.pc{width:32px;height:32px;border-radius:8px;text-align:center;font-size:15px;font-weight:700;
  background:var(--bg2);border:1px solid var(--line);color:var(--ts);outline:none;-moz-appearance:textfield}
.pc::-webkit-inner-spin-button,.pc::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pc:focus{border-color:var(--acc)}
.pc.exact{background:var(--win-bg);border-color:var(--win-line);color:var(--win-tx)}
.pc.outcome{background:var(--draw-bg);border-color:var(--draw-line);color:var(--draw-tx)}
.pc.miss{background:var(--loss-bg);border-color:var(--loss-line);color:var(--loss-tx)}
.pchip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap;display:none}
.pchip.exact{display:inline;background:var(--win-bg);color:var(--win-tx)}
.pchip.outcome{display:inline;background:var(--draw-bg);color:var(--draw-tx)}
.pchip.miss{display:inline;background:var(--loss-bg);color:var(--loss-tx)}

/* ---- Live match ---- */
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.25}}
.mc-card.live{background:#23252B;border-color:#5E2620}
.mc-card.live .mc-score .mc-colon{animation:blink 1s steps(1,end) infinite;color:#FF5A45}
.badge.live{display:none;align-items:center;gap:6px;background:#E0392B;color:#fff;font-weight:700;letter-spacing:.02em}
.mc-card.live .badge.live{display:inline-flex}
.badge.live::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;animation:livepulse 1.1s infinite}
.chip.today{border-color:var(--acc-line)}
.chip .td{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:1px}
.chip.today .td{background:var(--acc)}

/* ---- Bracket (tree) ---- */
.br-cols{display:flex;align-items:flex-start;gap:18px;padding:8px 0}
.br-col{flex:0 0 auto;width:120px;display:flex;flex-direction:column}
.br-coltitle{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--ts);text-align:center;text-transform:uppercase;margin-bottom:10px}
.br-colbody{display:flex;flex-direction:column}
.br-card{width:120px;background:var(--bg1);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.br-hd{display:flex;justify-content:space-between;align-items:center;padding:3px 8px;background:var(--hd)}
.br-hd .no{font-size:9px;font-weight:700;color:var(--tm)}
.br-hd .st{font-size:9px;font-weight:600;color:var(--tm)}
.br-team{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px}
.br-team+.br-team{border-top:1px solid var(--line)}
.br-team .nm{font-size:10.5px;font-weight:500;color:var(--tm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-team.real .nm{color:var(--tp)}
.br-team .sc-b{font-size:11px;font-weight:700;color:var(--ts)}
.br-team.win .nm{color:var(--win-tx);font-weight:700}.br-team.win .sc-b{color:var(--win-tx)}
.br-team.loss .nm{color:var(--loss-tx)}.br-team.loss .sc-b{color:var(--loss-tx)}
.br-team.draw .nm{color:var(--draw-tx)}.br-team.draw .sc-b{color:var(--draw-tx)}
.br-3rd-label{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--tm);text-transform:uppercase;text-align:center;padding-top:6px}

/* ---- Groups ---- */
.groups-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.group-card{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:16px}
.group-card .gh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.group-card .gbadge{width:22px;height:22px;border-radius:6px;background:var(--acc-soft);color:var(--acc);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.group-card .gt{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ts)}
.gtable{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.gtable th:not(:first-child),.gtable td:not(:first-child){width:32px}
.gtable th{color:var(--tm);font-weight:500;font-size:10px;text-align:center;padding:0 0 7px}
.gtable th:first-child{text-align:left}
.gtable td{padding:7px 0;text-align:center;border-top:1px solid #202225;color:var(--ts)}
.gtable td:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtable td:first-child{text-align:left;font-weight:500;color:var(--tp)}
.gtable td:last-child{font-weight:700;color:var(--tp)}
.gtable tr.q td:first-child{color:var(--acc);font-weight:600}
.gtable tr.q td:first-child::after{content:' ✓';font-size:10px;color:var(--acc)}
.gtable tr.q td:last-child{color:var(--acc)}
.gtable tr.q3 td:first-child{color:var(--draw-tx);font-weight:600}
.gtable tr.q3 td:first-child::after{content:' ③';font-size:10px;color:var(--draw-tx)}
.gtable tr.q3 td:last-child{color:var(--draw-tx)}
.hint{display:none}

/* ---- Prediction stats ---- */
.page-title{font-size:20px;font-weight:700;color:var(--tp);margin-bottom:16px}
.stats-grid{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.stat-card{flex:1 1 0;min-width:150px;background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.stat-card .v{font-size:30px;font-weight:800;color:var(--tp);line-height:1.05}
.stat-card .l{font-size:12px;color:var(--ts);margin-top:7px}
.stat-card.acc .v{color:var(--acc)}
.stat-card.green .v{color:var(--win-tx)}
.stat-card.amber .v{color:var(--draw-tx)}
.stat-card.red .v{color:var(--loss-tx)}
.dist-wrap{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.dist-wrap h3{font-size:13px;font-weight:700;color:var(--tp);margin-bottom:12px}
.dist{height:16px;border-radius:8px;overflow:hidden;display:flex;background:var(--bg2)}
.dist i{display:block;height:100%}
.dist .e{background:var(--win-tx)}.dist .o{background:var(--draw-tx)}.dist .m{background:var(--loss-tx)}
.legend{display:flex;gap:20px;margin-top:12px;font-size:12px;color:var(--ts);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:middle}
.stats-empty{text-align:center;padding:56px 24px;color:var(--ts);line-height:1.7}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px}
</style>
</head>
<body>
  <div class="chrome">
    <div class="brand">
      <div class="ball">⚽</div>
      <div>
        <h1 id="app-title">FIFA World Cup 2026</h1>
        <p id="app-sub"></p>
      </div>
    </div>
    <div class="chrome-right">
      <div class="settings">
        <select class="cfg" id="tz-select" onchange="onTzChange(this.value)"></select>
        <select class="cfg" id="lang-select" onchange="onLangChange(this.value)"></select>
      </div>
      <div class="segmented">
        <div class="seg active" data-tab="schedule" onclick="switchTab('schedule')"></div>
        <div class="seg" data-tab="bracket" onclick="switchTab('bracket')"></div>
        <div class="seg" data-tab="groups" onclick="switchTab('groups')"></div>
        <div class="seg" data-tab="stats" onclick="switchTab('stats')"></div>
      </div>
    </div>
  </div>

  <div class="carousel" id="carousel">
    <div class="car-arrow" onclick="scrollCarousel(-1)">‹</div>
    <div class="car-track" id="car-track"></div>
    <div class="car-arrow" onclick="scrollCarousel(1)">›</div>
  </div>

  <div class="main" id="main">
    <div id="tab-schedule" class="panel active">
      <div class="wrap"><div id="calendar"></div></div>
    </div>

    <div id="tab-bracket" class="panel">
      <div class="wrap" style="max-width:none"><div id="bracket"></div></div>
    </div>

    <div id="tab-groups" class="panel">
      <div class="wrap" style="max-width:1280px"><div class="groups-grid" id="groups-grid"></div></div>
    </div>

    <div id="tab-stats" class="panel">
      <div class="wrap"><div id="stats"></div></div>
    </div>
  </div>

<script>
// ===== i18n (UI + team names) & settings =====
const I18N = {
  en: {title:"FIFA World Cup 2026",dateRange:"11 Jun – 19 Jul 2026",timesLocal:"local time",tab_schedule:"Schedule",tab_bracket:"Bracket",tab_groups:"Groups",tab_stats:"Predictions",live:"Online",pred_caption:"your pick",stage_r32:"Round of 32",stage_r16:"Round of 16",stage_qf:"Quarter-finals",stage_sf:"Semi-finals",stage_final:"Final",stage_3p:"Third place",third_place_match:"Third-place match",pos1:"1st",pos2:"2nd",third_prefix:"3rd",winner_abbr:"W",loser_abbr:"L",tt_group_winner:"Winner of Group {g}",tt_group_runner:"Runner-up of Group {g}",tt_third:"Best third-placed team from groups {list} (8 best thirds advance)",tt_winner_match:"Winner of match #{n} · {stage}",tt_loser_match:"Loser of match #{n} · {stage}",group:"Group",team:"Team",col_P:"P",col_W:"W",col_D:"D",col_L:"L",col_GF:"GF",col_GA:"GA",col_Pts:"Pts",stats_title:"Prediction stats",stats_points:"points · exact ×3, outcome ×1",stats_accuracy:"guessed · exact + outcome",stats_made:"predictions made · of {n}",stats_evaluated:"matches evaluated",stats_exact:"exact score",stats_outcome:"outcome guessed",stats_miss:"missed",stats_dist:"Distribution of evaluated predictions",stats_empty:"Enter your prediction in the fields above the score, then the actual score. Your stats will appear here.",stats_made_note:"Predictions made: {n}. Waiting for results of played matches.",chip_exact:"✓ exact score",chip_outcome:"≈ outcome",chip_miss:"✗ missed",settings_timezone:"Timezone",settings_language:"Language"},

// ---- TIME ----
// Переводит исходное время матча (ET) в выбранный пользователем часовой пояс.
// Через Intl с timeZone — корректно учитывает летнее время; локаль задаёт названия дней/месяцев.
function etToTsh(etStr){
  const inst = matchStartMs(etStr);          // абсолютный момент старта (UTC, мс)
  const tz = SETTINGS.tz, loc = curLocale();
  const parts = new Intl.DateTimeFormat('en-CA', {timeZone:tz, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).formatToParts(inst);
  const g = ty => { const p = parts.find(x => x.type === ty); return p ? p.value : ''; };
  let hh = g('hour'); if(hh === '24') hh = '00';
  const dateKey = g('year') + '-' + g('month') + '-' + g('day');
  return {
    time: hh + ':' + g('minute'),
    dateKey: dateKey,
    wd: new Intl.DateTimeFormat(loc, {timeZone:tz, weekday:'short'}).format(inst),
    dnum: parseInt(g('day'), 10),
    mon: new Intl.DateTimeFormat(loc, {timeZone:tz, month:'short'}).format(inst),
    dayLabel: new Intl.DateTimeFormat(loc, {timeZone:tz, weekday:'short', day:'numeric', month:'long'}).format(inst),
    origTime: etStr.split(' ')[1] + ' ET'
  };
}

// ---- SCORE HANDLERS ----
function outcomeFor(s1, s2, side){
  if(s1==='' || s2==='') return 'none';
  const a = parseInt(s1), b = parseInt(s2);
  if(isNaN(a) || isNaN(b)) return 'none';
  if(a === b) return 'draw';
  return side === 1 ? (a > b ? 'win' : 'loss') : (b > a ? 'win' : 'loss');
}

function applyScoreColors(matchId){
  const sc = results[matchId] || {s1:'', s2:''};
  const o1 = outcomeFor(sc.s1, sc.s2, 1), o2 = outcomeFor(sc.s1, sc.s2, 2);
  const i1 = document.getElementById('sc-'+matchId+'-s1');
  const i2 = document.getElementById('sc-'+matchId+'-s2');
  if(i1) i1.className = 'sc ' + o1;
  if(i2) i2.className = 'sc ' + o2;
  const n1 = document.getElementById('nm-'+matchId+'-1');
  const n2 = document.getElementById('nm-'+matchId+'-2');
  if(n1) n1.classList.toggle('win', o1==='win');
  if(n2) n2.classList.toggle('win', o2==='win');
}

function onScoreInput(matchId, field, value){
  if(!results[matchId]) results[matchId] = {s1:'', s2:''};
  results[matchId][field] = value;
  invalidateCaches();
  window.go.main.App.SaveResults(JSON.stringify(results)).catch(console.error);
  applyScoreColors(matchId);
  applyPredColors(matchId);
  const r = results[matchId];
  if(r.s1 !== '' && r.s2 !== ''){
    refreshKnockoutTeams();
    renderBracket();
    renderGroups();
  }
}

// ---- PREDICTIONS ----
function predStatus(id){
  const r = results[id] || {};
  const has = v => v !== undefined && v !== '';
  if(!has(r.p1) || !has(r.p2)) return 'nopred';
  if(!has(r.s1) || !has(r.s2)) return 'pending';
  const p1=parseInt(r.p1), p2=parseInt(r.p2), s1=parseInt(r.s1), s2=parseInt(r.s2);
  if([p1,p2,s1,s2].some(isNaN)) return 'pending';
  if(p1===s1 && p2===s2) return 'exact';
  return Math.sign(p1-p2) === Math.sign(s1-s2) ? 'outcome' : 'miss';
}
function predChip(ps){
  if(ps==='exact')   return ['exact', t('chip_exact')];
  if(ps==='outcome') return ['outcome', t('chip_outcome')];
  if(ps==='miss')    return ['miss', t('chip_miss')];
  return ['',''];
}
function applyPredColors(id){
  const ps = predStatus(id);
  const cls = (ps==='exact'||ps==='outcome'||ps==='miss') ? ps : '';
  const p1 = document.getElementById('pc-'+id+'-p1');
  const p2 = document.getElementById('pc-'+id+'-p2');
  if(p1) p1.className = 'pc ' + cls;
  if(p2) p2.className = 'pc ' + cls;

  if(chip){ const c = predChip(ps); chip.className = 'pchip ' + c[0]; chip.textContent = c[1]; }
}

// ---- GROUP STANDINGS & TIE-BREAKERS (правила ФИФА ЧМ-2026) ----
// Очки → личные встречи (очки, разница, голы между равными) → общая разница →
// общие голы → честная игра → рейтинг ФИФА. Последние два из счёта не вычисляются,
// поэтому при полном равенстве — детерминированный фолбэк (по алфавиту).
let _rankCache = {}, _allocCache;
function invalidateCaches(){ _rankCache = {}; _allocCache = undefined; }

function groupMatches(g){ return MATCHES.filter(m => m.stage==='group' && m.g===g); }
function groupComplete(g){
  return groupMatches(g).every(m => {
    const r = results[m.id];
    return r && r.s1!=='' && r.s2!=='' && !isNaN(parseInt(r.s1)) && !isNaN(parseInt(r.s2));
  });
}
function overallStats(matches){
  const st = {};
  const ens = t => { if(!st[t]) st[t] = {p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0}; };
  matches.forEach(m => {
    ens(m.t1); ens(m.t2);
    const r = results[m.id]; if(!r || r.s1==='' || r.s2==='') return;
    const a = parseInt(r.s1), b = parseInt(r.s2); if(isNaN(a)||isNaN(b)) return;
    const A = st[m.t1], B = st[m.t2];
    A.p++; B.p++; A.gf+=a; A.ga+=b; B.gf+=b; B.ga+=a;
    if(a>b){A.w++;A.pts+=3;B.l++;} else if(b>a){B.w++;B.pts+=3;A.l++;} else {A.d++;A.pts++;B.d++;B.pts++;}
  });
  Object.values(st).forEach(s => s.gd = s.gf - s.ga);
  return st;
}
function bucketBy(arr, keyFn){
  const out = []; let cur = [], k = null;
  arr.forEach(x => { const kk = keyFn(x); if(kk !== k){ if(cur.length) out.push(cur); cur=[x]; k=kk; } else cur.push(x); });
  if(cur.length) out.push(cur);
  return out;
}
function fallbackOrder(teams){ return teams.slice().sort((a,b) => a.localeCompare(b,'ru')); }
function resolveTie(subset, ov, allMs){
  if(subset.length <= 1) return subset.slice();
  // личные встречи между равными
  const subMs = allMs.filter(m => subset.includes(m.t1) && subset.includes(m.t2));
  const h = overallStats(subMs);
  subset.forEach(t => { if(!h[t]) h[t] = {pts:0,gd:0,gf:0}; });
  const sorted = subset.slice().sort((a,b) => h[b].pts-h[a].pts || h[b].gd-h[a].gd || h[b].gf-h[a].gf);
  const hb = bucketBy(sorted, t => h[t].pts+','+h[t].gd+','+h[t].gf);
  if(hb.length > 1){
    const res = []; hb.forEach(b => res.push(...(b.length>1 ? resolveTie(b, ov, allMs) : b))); return res;
  }
  // личные встречи не разделили → общая разница, общие голы
  const os = subset.slice().sort((a,b) => ov[b].gd-ov[a].gd || ov[b].gf-ov[a].gf);
  const ob = bucketBy(os, t => ov[t].gd+','+ov[t].gf);
  if(ob.length > 1){
    const res = []; ob.forEach(b => res.push(...(b.length>1 ? fallbackOrder(b) : b))); return res;
  }
  return fallbackOrder(subset);
}
function rankGroup(g){
  if(_rankCache[g]) return _rankCache[g];
  const ms = groupMatches(g);
  const teams = [...new Set(ms.flatMap(m => [m.t1, m.t2]))];
  const ov = overallStats(ms);
  const order = teams.slice().sort((a,b) => ov[b].pts - ov[a].pts);
  const buckets = bucketBy(order, t => String(ov[t].pts));
  const res = [];
  buckets.forEach(b => res.push(...resolveTie(b, ov, ms)));
  _rankCache[g] = res;
  return res;
}

// ---- BEST THIRD-PLACED TEAMS + ALLOCATION (Annex C) ----
// Каждый слот «3-х мест» допускает третьих только из своих групп. Наборы из регламента
// устроены так, что для любой комбинации 8 групп существует единственное допустимое
// назначение, поэтому точное паросочетание воспроизводит официальную таблицу ФИФА.
const TSLOTS = [
  {k:'m74', s:'ABCDF'}, {k:'m77', s:'CDFGH'}, {k:'m79', s:'CEFHI'}, {k:'m80', s:'EHIJK'},
  {k:'m82', s:'AEHIJ'}, {k:'m81', s:'BEFIJ'}, {k:'m85', s:'EFGIJ'}, {k:'m87', s:'DEIJL'}
];
const SET_TO_SLOT = {}; TSLOTS.forEach(s => SET_TO_SLOT[s.s] = s.k);
function matchThirds(qGroups){
  const q = new Set(qGroups);
  const slots = TSLOTS.map(s => ({k:s.k, cand:[...s.s].filter(g => q.has(g))}));
  const order = slots.slice().sort((a,b) => a.cand.length - b.cand.length);
  const used = new Set(), res = {};
  function bt(i){
    if(i === order.length) return true;
    const sl = order[i];
    for(const g of sl.cand){ if(used.has(g)) continue; used.add(g); res[sl.k]=g; if(bt(i+1)) return true; used.delete(g); delete res[sl.k]; }
    return false;
  }
  return bt(0) ? res : null;
}
function thirdsAllocation(){
  if(_allocCache !== undefined) return _allocCache;
  const groups = 'ABCDEFGHIJKL'.split('');
  if(!groups.every(groupComplete)){ _allocCache = null; return null; }
  const byGroup = {};
  const thirds = groups.map(g => {
    const name = rankGroup(g)[2];
    const s = overallStats(groupMatches(g))[name];
    byGroup[g] = name;
    return {g, name, pts:s.pts, gd:s.gd, gf:s.gf};
  });
  const ranked = thirds.slice().sort((a,b) => b.pts-a.pts || b.gd-a.gd || b.gf-a.gf || a.g.localeCompare(b.g));
  const qualifiedGroups = ranked.slice(0,8).map(x => x.g);
  const assignBySlot = matchThirds(qualifiedGroups) || {};
  _allocCache = {byGroup, qualifiedGroups, assignBySlot};
  return _allocCache;
}

// ---- SLOT RESOLUTION ----
function isSlot(slot){ return /^[12][A-L]$/.test(slot) || /^3:/.test(slot) || /^[WL]:m\d+$/.test(slot); }

function slotLabel(slot){
  let m = /^([12])([A-L])$/.exec(slot);
  if(m) return (m[1]==='1' ? t('pos1') : t('pos2')) + ' ' + m[2];
  if(slot.indexOf('3:') === 0) return t('third_prefix') + ' ' + slot.slice(2).split('').join('/');
  const mt = /^([WL]):(m\d+)$/.exec(slot);
  if(mt){ const cm = byId[mt[2]]; return (mt[1]==='W' ? t('winner_abbr') : t('loser_abbr')) + ' ' + stageNum[mt[2]] + ' · ' + stageSym(cm.stage); }
  return slot;
}
// Полная расшифровка слота для всплывающей подсказки (title)
function slotTitle(slot){
  let m = /^([12])([A-L])$/.exec(slot);
  if(m) return t(m[1]==='1' ? 'tt_group_winner' : 'tt_group_runner', {g:m[2]});
  if(slot.indexOf('3:') === 0) return t('tt_third', {list: slot.slice(2).split('').join(', ')});
  const mt = /^([WL]):(m\d+)$/.exec(slot);
  if(mt){ const cm = byId[mt[2]]; return t(mt[1]==='W' ? 'tt_winner_match' : 'tt_loser_match', {n: stageNum[mt[2]], stage: stageFull(cm.stage)}); }
  return '';
}
function resolveTeam(slot, depth){
  if(depth > 12 || !slot) return slot;
  // победитель / второе место группы
  let m = /^([12])([A-L])$/.exec(slot);
  if(m){ const pos = +m[1], g = m[2]; if(!groupComplete(g)) return '?'; const r = rankGroup(g); return r[pos-1] || '?'; }
  // лучший третий
  if(slot.indexOf('3:') === 0){ const a = thirdsAllocation(); if(!a) return '?'; const g = a.assignBySlot[SET_TO_SLOT[slot.slice(2)]]; return g ? (a.byGroup[g] || '?') : '?'; }
  // победитель / проигравший матча плей-офф
  if(!slot.includes(':')) return slot;
  const [type, matchId] = slot.split(':');
  const match = byId[matchId]; if(!match) return slot;
  const sc = results[matchId]; if(!sc || sc.s1==='' || sc.s2==='') return '?';
  const s1 = parseInt(sc.s1), s2 = parseInt(sc.s2); if(isNaN(s1)||isNaN(s2)) return '?';
  const t1 = resolveTeam(match.t1, depth+1), t2 = resolveTeam(match.t2, depth+1);
  if(type === 'W') return s1 > s2 ? t1 : s2 > s1 ? t2 : t1+'/'+t2;
  if(type === 'L') return s1 < s2 ? t1 : s2 < s1 ? t2 : '?';
  return slot;
}
// Реальная команда, либо понятный плейсхолдер
function teamView(slot){
  const rv = resolveTeam(slot, 0);
  if(rv === '?' || rv == null) return {disp: slotLabel(slot), real: false};
  return {disp: teamName(rv), real: true};
}
function dispTeam(slot){ return teamView(slot).disp; }

// ---- RENDER SCHEDULE ----
function computeDayList(){
  const seen = {}, arr = [];
  MATCHES.forEach(m => {
    const d = etToTsh(m.et);
    if(!seen[d.dateKey]){ seen[d.dateKey] = 1; arr.push(d); }
  });
  return arr.sort((a,b) => a.dateKey < b.dateKey ? -1 : 1);
}
let DAY_LIST = computeDayList();

function badgeFor(m){
  if(m.stage === 'group') return `<span class="badge group">${t('group')} ${m.g}</span>`;
  return `<span class="badge ko">${stageSym(m.stage)}</span>`;
}

// ---- LIVE & CALENDAR ----
// ДЛЯ ТЕСТА: поставь ISO-время (по Ташкенту), чтобы приложение «думало», что сейчас этот момент.
// В проде должно быть null — тогда берётся реальное время.
const NOW_OVERRIDE = null;
function now(){ return NOW_OVERRIDE ? Date.parse(NOW_OVERRIDE) : Date.now(); }
const LIVE_DURATION_MS = 135 * 60 * 1000; // окно «матч идёт» с запасом на перерыв и добавленное
function matchStartMs(etStr){
  const [d, tt] = etStr.split(' ');
  const [Y, Mo, D] = d.split('-').map(Number);
  const [h, mi] = tt.split(':').map(Number);
  return Date.UTC(Y, Mo - 1, D, h, mi) + 4 * 3600 * 1000; // ET = UTC−4 → абсолютный момент старта
}
function isLive(m){
  const s = matchStartMs(m.et);
  const t = now();
  return t >= s && t < s + LIVE_DURATION_MS;
}
function updateLiveStates(){
  MATCHES.forEach(m => {
    const card = document.getElementById('card-' + m.id);
    if(card) card.classList.toggle('live', isLive(m));
  });
}
function todayTshKey(){
  return new Date(now() + 5 * 3600 * 1000).toISOString().slice(0, 10); // сегодняшняя дата по Ташкенту
}
function targetDayKey(){
  const tk = todayTshKey();
  const keys = DAY_LIST.map(d => d.dateKey);
  if(keys.includes(tk)) return tk;
  return keys.find(k => k > tk) || keys[keys.length - 1]; // ближайший будущий, иначе последний
}
function scrollToToday(){
  const tg = targetDayKey();
  if(tg) goToDay(tg, 'auto');
}

function buildCarousel(){
  const tk = todayTshKey();
  document.getElementById('car-track').innerHTML = DAY_LIST.map(t => `
    <div class="chip ${t.dateKey===tk?'today':''}" data-key="${t.dateKey}" onclick="goToDay('${t.dateKey}')">
      <span class="wd">${t.wd}</span><span class="dn">${t.dnum}</span><span class="td"></span>
    </div>`).join('');
}

function renderSchedule(){
  const days = {};
  MATCHES.forEach(m => {
    const tsh = etToTsh(m.et);
    if(!days[tsh.dateKey]) days[tsh.dateKey] = {label: tsh.dayLabel, list:[]};
    days[tsh.dateKey].list.push({m, tsh});
  });

  document.getElementById('calendar').innerHTML = Object.entries(days)
    .sort((a,b) => a[0] < b[0] ? -1 : 1)
    .map(([key, day]) => `
      <div class="day-block" id="day-${key}">
        <div class="day-head">${day.label}</div>
        ${day.list.map(({m, tsh}) => {
          const r = results[m.id] || {};
          const sc = {s1: r.s1||'', s2: r.s2||''};
          const pr = {p1: r.p1||'', p2: r.p2||''};
          const o1 = outcomeFor(sc.s1, sc.s2, 1), o2 = outcomeFor(sc.s1, sc.s2, 2);
          const ps = predStatus(m.id);
          const pcCls = (ps==='exact'||ps==='outcome'||ps==='miss') ? ps : '';
          const chip = predChip(ps);
          const nm = (slot, idx, oc) => {
            const v = teamView(slot);
            return `<span class="mc-name ${oc==='win'?'win':''}" id="nm-${m.id}-${idx}"${isSlot(slot)?` data-ko-team="${slot}" title="${slotTitle(slot)}"`:''}>${v.disp}</span>`;
          };
          return `<div class="mc-card" id="card-${m.id}">
            <div class="mc-row">
              <div class="mc-team left">${nm(m.t1,1,o1)}</div>
              <div class="mc-center">
                <span class="mc-cap">${t('pred_caption')}</span>
                <div class="mc-pred">
                  <input class="pc ${pcCls}" id="pc-${m.id}-p1" type="number" min="0" max="99" inputmode="numeric"
                    value="${pr.p1}" placeholder="–" oninput="onPredInput('${m.id}','p1',this.value)">
                  <span class="mc-colon">:</span>
                  <input class="pc ${pcCls}" id="pc-${m.id}-p2" type="number" min="0" max="99" inputmode="numeric"
                    value="${pr.p2}" placeholder="–" oninput="onPredInput('${m.id}','p2',this.value)">
                </div>
                <div class="mc-score">
                  <input class="sc ${o1}" id="sc-${m.id}-s1" type="number" min="0" max="99" inputmode="numeric"
                    value="${sc.s1}" placeholder="–" oninput="onScoreInput('${m.id}','s1',this.value)">
                  <span class="mc-colon">:</span>
                  <input class="sc ${o2}" id="sc-${m.id}-s2" type="number" min="0" max="99" inputmode="numeric"
                    value="${sc.s2}" placeholder="–" oninput="onScoreInput('${m.id}','s2',this.value)">
                </div>
              </div>
              <div class="mc-team right">${nm(m.t2,2,o2)}</div>
            </div>
            <div class="mc-meta">
              <span class="mc-time">${tsh.time}<em>${tsh.origTime}</em></span>
              <span class="badge live" id="live-${m.id}">${t('live')}</span>
              <span class="dot">·</span>
              <span class="mc-venue">${m.v}</span>
              <span class="dot">·</span>
              ${badgeFor(m)}
              <span class="pchip ${chip[0]}" id="pchip-${m.id}">${chip[1]}</span>
            </div>
          </div>`;
        }).join('')}
      </div>`).join('');
}

// ---- DATE CAROUSEL NAV ----
function goToDay(key, behavior='smooth'){
  const main = document.getElementById('main');
  const el = document.getElementById('day-'+key);
  if(!el) return;
  const top = el.getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop - 8;
  main.scrollTo({top: Math.max(0, top), behavior});
  setActiveChip(key);
}
function setActiveChip(key){
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.key === key));
  const ac = document.querySelector('.chip.active');
  if(ac) ac.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}
function scrollCarousel(dir){
  document.getElementById('car-track').scrollBy({left: dir*260, behavior:'smooth'});
}

// scrollspy — подсветка активного дня при прокрутке списка
let spyTick = false;
function initScrollSpy(){
  const main = document.getElementById('main');
  main.addEventListener('scroll', () => {
    if(spyTick) return;
    spyTick = true;
    requestAnimationFrame(() => {
      spyTick = false;
      if(!document.getElementById('tab-schedule').classList.contains('active')) return;
      const blocks = document.querySelectorAll('.day-block');
      const threshold = main.getBoundingClientRect().top + 120;
      let cur = null;
      blocks.forEach(b => { if(b.getBoundingClientRect().top <= threshold) cur = b.id.replace('day-',''); });
      if(cur){
        document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.key === cur));
        const ac = document.querySelector('.chip.active');
        if(ac) ac.scrollIntoView({inline:'center', block:'nearest'});
      }
    });
  });
}

// ---- RENDER BRACKET (дерево) ----
function kidsOf(m){
  return [m.t1, m.t2].map(s => { const mt = /^[WL]:(m\d+)$/.exec(s); return mt ? mt[1] : null; });
}
function dfsLevels(id){
  const m = byId[id];
  const k = kidsOf(m);
  if(!k[0]) return [[id]];
  const L = dfsLevels(k[0]), R = dfsLevels(k[1]);
  const out = [[id]];
  const depth = Math.max(L.length, R.length);
  for(let i=0;i<depth;i++) out.push([...(L[i]||[]), ...(R[i]||[])]);
  return out;
}

function brCard(id){
  const m = byId[id], sc = results[id] || {s1:'', s2:''};
  const o1 = outcomeFor(sc.s1, sc.s2, 1), o2 = outcomeFor(sc.s1, sc.s2, 2);
  const tsh = etToTsh(m.et);
  const row = (slot, oc, score) => {
    const v = teamView(slot);
    return `<div class="br-team ${oc} ${v.real?'real':''}" title="${slotTitle(slot)}">
      <span class="nm">${v.disp}</span><span class="sc-b">${score!==''?score:''}</span></div>`;
  };
  return `<div class="br-card">
    <div class="br-hd"><span class="no">№${stageNum[id]}</span><span class="st">${tsh.dnum}.${String(byId[id].et.split('-')[1])} · ${tsh.time}</span></div>
    ${row(m.t1, o1, sc.s1)}
    ${row(m.t2, o2, sc.s2)}
  </div>`;
}

function renderBracket(){
  const cardH = 58, baseGap = 14, pitch = cardH + baseGap;
  const col = (ids, idx, title) => {
    const gap = (2**idx)*pitch - cardH;
    const padTop = ((2**idx)-1)*pitch/2;
    return `<div class="br-col"><div class="br-coltitle">${title}</div>
      <div class="br-colbody" style="padding-top:${padTop}px;row-gap:${gap}px">
      ${ids.map(brCard).join('')}</div></div>`;
  };

  // левая половина (под m101): R32 → 1/2, слева направо
  const left = dfsLevels('m101').slice().reverse();   // [R32(8),R16(4),QF(2),SF(1)]
  // правая половина (под m102): 1/2 → R32, от центра вправо
  const right = dfsLevels('m102');                    // [SF(1),QF(2),R16(4),R32(8)]
  const labelsL = [stageFull('r32'), stageFull('r16'), stageFull('qf'), stageFull('sf')];
  const labelsR = [stageFull('sf'), stageFull('qf'), stageFull('r16'), stageFull('r32')];

  let html = '<div class="br-cols">';
  left.forEach((ids, idx) => { html += col(ids, idx, labelsL[idx]); });

  // центральная колонка: финал + матч за 3-е место
  const centerPad = ((2**3)-1)*pitch/2;
  html += `<div class="br-col br-center"><div class="br-coltitle">${t('stage_final')}</div>
    <div class="br-colbody" style="padding-top:${centerPad}px;row-gap:8px">
      ${brCard('m104')}
      <div class="br-3rd-label">${t('third_place_match')}</div>
      ${brCard('m103')}
    </div></div>`;

  right.forEach((ids, pos) => { html += col(ids, 3 - pos, labelsR[pos]); });
  html += '</div>';
  document.getElementById('bracket').innerHTML = html;
}

// ---- RENDER GROUPS ----
function computeStandings(){
  const st = {};
  MATCHES.filter(m => m.stage === 'group').forEach(m => {
    if(!st[m.g]) st[m.g] = {};
    [m.t1, m.t2].forEach(t => { if(!st[m.g][t]) st[m.g][t] = {p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}; });
    const sc = results[m.id];
    if(!sc || sc.s1==='' || sc.s2==='') return;
    const s1=parseInt(sc.s1), s2=parseInt(sc.s2);
    st[m.g][m.t1].p++; st[m.g][m.t2].p++;
    st[m.g][m.t1].gf+=s1; st[m.g][m.t1].ga+=s2;
    st[m.g][m.t2].gf+=s2; st[m.g][m.t2].ga+=s1;
    if(s1>s2){st[m.g][m.t1].w++;st[m.g][m.t1].pts+=3;st[m.g][m.t2].l++;}
    else if(s2>s1){st[m.g][m.t2].w++;st[m.g][m.t2].pts+=3;st[m.g][m.t1].l++;}
    else{st[m.g][m.t1].d++;st[m.g][m.t1].pts++;st[m.g][m.t2].d++;st[m.g][m.t2].pts++;}
  });
  return st;
}

function renderGroups(){
  const alloc = thirdsAllocation();
  document.getElementById('groups-grid').innerHTML = 'ABCDEFGHIJKL'.split('').map(g => {
    const st = overallStats(groupMatches(g));
    const order = rankGroup(g);
    return `<div class="group-card">
      <div class="gh"><span class="gbadge">${g}</span><span class="gt">${t('group')}</span></div>
      <table class="gtable">
        <thead><tr><th>${t('team')}</th><th>${t('col_P')}</th><th>${t('col_W')}</th><th>${t('col_D')}</th><th>${t('col_L')}</th><th>${t('col_GF')}</th><th>${t('col_GA')}</th><th>${t('col_Pts')}</th></tr></thead>
        <tbody>${order.map((name,i) => {
          const s = st[name] || {p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
          const cls = i<2 ? 'q' : (i===2 && alloc && alloc.qualifiedGroups.includes(g) ? 'q3' : '');
          return `<tr class="${cls}">
            <td>${teamName(name)}</td>
            <td>${s.p}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td>
            <td>${s.gf}</td><td>${s.ga}</td><td>${s.pts}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>`;
  }).join('');
}

// ---- RENDER PREDICTION STATS ----
function renderStats(){
  let exact=0, outcome=0, miss=0, predicted=0;
  MATCHES.forEach(m => {
    const r = results[m.id] || {};
    if(r.p1 !== undefined && r.p1 !== '' && r.p2 !== undefined && r.p2 !== '') predicted++;
    const st = predStatus(m.id);
    if(st==='exact') exact++; else if(st==='outcome') outcome++; else if(st==='miss') miss++;
  });
  const evaluated = exact + outcome + miss;
  const points = exact*3 + outcome;
  const acc = evaluated ? Math.round((exact+outcome)/evaluated*100) : 0;
  const el = document.getElementById('stats');

  if(evaluated === 0){
    el.innerHTML = `<div class="page-title">${t('stats_title')}</div>
      <div class="stats-empty">${t('stats_empty')}
      ${predicted ? '<br><br>' + t('stats_made_note', {n: '<b>'+predicted+'</b>'}) : ''}</div>`;
    return;
  }
  const pct = v => evaluated ? (v/evaluated*100) : 0;
  el.innerHTML = `<div class="page-title">${t('stats_title')}</div>
    <div class="stats-grid">
      <div class="stat-card acc"><div class="v">${points}</div><div class="l">${t('stats_points')}</div></div>
      <div class="stat-card acc"><div class="v">${acc}%</div><div class="l">${t('stats_accuracy')}</div></div>
      <div class="stat-card"><div class="v">${predicted}</div><div class="l">${t('stats_made', {n: MATCHES.length})}</div></div>
      <div class="stat-card"><div class="v">${evaluated}</div><div class="l">${t('stats_evaluated')}</div></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card green"><div class="v">${exact}</div><div class="l">${t('stats_exact')}</div></div>
      <div class="stat-card amber"><div class="v">${outcome}</div><div class="l">${t('stats_outcome')}</div></div>
      <div class="stat-card red"><div class="v">${miss}</div><div class="l">${t('stats_miss')}</div></div>
    </div>
    <div class="dist-wrap">
      <h3>${t('stats_dist')}</h3>
      <div class="dist">
        <i class="e" style="width:${pct(exact)}%"></i>
        <i class="o" style="width:${pct(outcome)}%"></i>
        <i class="m" style="width:${pct(miss)}%"></i>
      </div>
      <div class="legend">
        <span><i style="background:var(--win-tx)"></i>${t('stats_exact')} — ${exact}</span>
        <span><i style="background:var(--draw-tx)"></i>${t('stats_outcome')} — ${outcome}</span>
        <span><i style="background:var(--loss-tx)"></i>${t('stats_miss')} — ${miss}</span>
      </div>
    </div>`;
}

// ---- TABS ----
function switchTab(id){
  document.querySelectorAll('.seg').forEach(t => t.classList.toggle('active', t.dataset.tab === id));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'tab-'+id));
  document.getElementById('carousel').style.display = id === 'schedule' ? 'flex' : 'none';
  if(id === 'bracket') renderBracket();
  if(id === 'groups') renderGroups();
  if(id === 'stats') renderStats();
}

// ---- SETTINGS (часовой пояс + язык) ----
function tzCity(z){ return z === 'UTC' ? 'UTC' : z.split('/').pop().replace(/_/g,' '); }
function tzOffset(z){
  try{
    const p = new Intl.DateTimeFormat('en-US', {timeZone:z, timeZoneName:'shortOffset'})
      .formatToParts(new Date(Date.UTC(2026,6,1,12))).find(x => x.type === 'timeZoneName');
    return p ? p.value : '';
  } catch(e){ return ''; }
}
function initSettingsUI(){
  const list = TZLIST.slice();
  if(!list.includes(SETTINGS.tz)) list.unshift(SETTINGS.tz);
  document.getElementById('tz-select').innerHTML = list.map(z =>
    `<option value="${z}"${z===SETTINGS.tz?' selected':''}>${tzCity(z)} (${tzOffset(z)})</option>`).join('');
  document.getElementById('lang-select').innerHTML = LANGS.map(([code,name]) =>
    `<option value="${code}"${code===SETTINGS.lang?' selected':''}>${name}</option>`).join('');
}
function applyStaticTexts(){
  document.getElementById('app-title').textContent = t('title');
  document.getElementById('app-sub').textContent = t('dateRange') + ' · ' + t('timesLocal') + ' (' + tzCity(SETTINGS.tz) + ')';
  document.querySelectorAll('.seg').forEach(s => { s.textContent = t('tab_' + s.dataset.tab); });
}
function saveSettings(){
  try { window.go.main.App.SaveSettings(JSON.stringify(SETTINGS)).catch(console.error); } catch(e){}
}
function renderAll(){
  applyStaticTexts();
  DAY_LIST = computeDayList();
  buildCarousel();
  renderSchedule();
  renderBracket();
  renderGroups();
  renderStats();
  updateLiveStates();
  scrollToToday();
}
function onTzChange(v){ SETTINGS.tz = v; saveSettings(); renderAll(); }
function onLangChange(v){ SETTINGS.lang = v; saveSettings(); renderAll(); }

// ---- INIT ----
initSettingsUI();
applyStaticTexts();
buildCarousel();
renderSchedule();
initScrollSpy();
updateLiveStates();
setInterval(updateLiveStates, 30000);
scrollToToday();

window.addEventListener('DOMContentLoaded', async () => {
  try {
    const s = JSON.parse(await window.go.main.App.LoadSettings());
    if(s && typeof s === 'object'){
      if(s.lang && I18N[s.lang]) SETTINGS.lang = s.lang;
      if(s.tz) SETTINGS.tz = s.tz;
    }
  } catch(e){ console.error('settings load failed', e); }
  try {
    results = JSON.parse(await window.go.main.App.LoadResults()) || {};
  } catch(e){ console.error('results load failed', e); }
  initSettingsUI();
  invalidateCaches();
  renderAll();
});
</script>
